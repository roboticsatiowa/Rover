# https://docs.nav2.org/setup_guides/odom/setup_robot_localization.html

# X   Y   Z     Cartesian 
# R   P   Y     Polar
# X'  Y'  Z'    <axis> "prime" aka first derivative
# R'  P'  Y'
# X'' Y'' Z''   <axis> "double prime" aka second derivative 

/uirover/navigation/ekf_global:
  ros__parameters:
    frequency: 30.0
    two_d_mode: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # wheel odom
    odom0: /uirover/control/diff_drive_controller/odom
    odom0_config:
      [ false, false, false,
        false, false, false,   
        true,  false, false, 
        false, false, false, 
        false, false, false,
      ]
    
    # filtered GPS
    odom1: /uirover/navigation/odometry/gps
    odom1_config:
      [ false, false, false, 
        false, false, false, 
        true,  true,  false, 
        false, false, true, 
        false, false, false,
      ]

    # provides everything except absolute cartesian coordinates.
    imu0_remove_gravitational_acceleration: true
    imu0: /uirover/navigation/imu
    imu0_config:
      [ false, false, false, 
        true,  true,  true, 
        true,  true,  true, 
        true,  true,  true, 
        true,  true,  true,
      ]

